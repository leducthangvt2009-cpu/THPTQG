<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiếng Anh · Ôn tập THPT</title>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html"><span>🎲 Ôn tập THPT</span></a>
    <nav class="nav">
      <a href="index.html">Bàn cờ</a>
      <a href="anh.html" aria-current="page">Tiếng Anh</a>
      <a href="hoa.html">Hóa học</a>
      <a href="sinh.html">Sinh học</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<dialog id="dlg">
  <form method="dialog">
    <p id="dlg-msg"></p>
    <div class="dlg-actions">
      <button class="btn small ghost" value="cancel" id="dlg-cancel"></button>
      <button class="btn small" value="ok" id="dlg-ok"></button>
    </div>
  </form>
</dialog>

<script src="js/data-anh.js"></script>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(s) {
    var h = esc(s);
    h = h.replace(/\((\d+)\)\s*_+/g, function (m, n) { return '<button type="button" class="blank" data-act="blank" data-n="' + n + '">(' + n + ') ______</button>'; });
    h = h.replace(/_{3,}/g, '<span class="gap"></span>');
    return h;
  }
  var store = {
    get: function (k, f) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function mmss(s) { return pad(Math.floor(s / 60)) + ':' + pad(s % 60); }
  function modeName(m) { return m === 'exam' ? 'Thi thử' : 'Luyện tập'; }
  function ask(msg, ok, cancel) {
    return new Promise(function (res) {
      var d = $('#dlg');
      if (typeof d.showModal !== 'function') { res(window.confirm(msg)); return; }
      $('#dlg-msg').textContent = msg;
      $('#dlg-ok').textContent = ok || 'Đồng ý';
      $('#dlg-cancel').textContent = cancel || 'Hủy';
      d.returnValue = '';
      var onClose = function () { d.removeEventListener('close', onClose); res(d.returnValue === 'ok'); };
      d.addEventListener('close', onClose);
      d.showModal();
    });
  }
  function getTest(id) { for (var i = 0; i < TESTS.length; i++) if (TESTS[i].id === id) return TESTS[i]; return null; }
  function buildMap(test) {
    var m = {};
    test.blocks.forEach(function (b, bi) { b.questions.forEach(function (q) { m[q.n] = { q: q, bi: bi }; }); });
    return m;
  }
  function allQids(test) { var r = []; test.blocks.forEach(function (b) { b.questions.forEach(function (q) { r.push(q.n); }); }); return r; }
  function total(test) { return allQids(test).length; }
  function progKey(id) { return 'ontap:progress:' + id; }
  function histAll() { return store.get('ontap:history', []); }

  var S = { test: null, qmap: null, mode: 'practice', label: '', qids: [], answers: {}, flags: {}, blockIdx: 0,
            startMs: 0, secs: 0, submitted: false, review: false, onlyWrong: false, result: null, timer: null, paletteOpen: false };

  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  function startAttempt(test, mode, qids, label) {
    S.test = test; S.qmap = buildMap(test); S.mode = mode; S.qids = qids.slice(); S.label = label || '';
    S.answers = {}; S.flags = {}; S.blockIdx = 0; S.secs = 0; S.startMs = Date.now();
    S.submitted = false; S.review = false; S.onlyWrong = false; S.result = null; S.paletteOpen = false;
    saveProgress();
    go('#lam-bai');
  }
  function saveProgress() {
    if (!S.test || S.submitted) return;
    store.set(progKey(S.test.id), { v: 1, mode: S.mode, label: S.label, qids: S.qids, answers: S.answers, flags: S.flags, blockIdx: S.blockIdx, secs: S.secs });
  }
  function startTimer() {
    if (S.timer || S.submitted) return;
    S.timer = setInterval(function () {
      S.secs = Math.floor((Date.now() - S.startMs) / 1000);
      var el = $('#rb-time'); if (el) el.textContent = mmss(S.secs);
    }, 1000);
  }
  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

  function reveal(n) { return S.submitted || (S.mode === 'practice' && !!S.answers[n]); }
  function visibleQids() {
    var ids = S.qids;
    if (S.review && S.onlyWrong) ids = ids.filter(function (n) { return S.answers[n] !== S.qmap[n].q.ans; });
    return ids;
  }
  function visibleBlocks() {
    var set = {}; visibleQids().forEach(function (n) { set[n] = 1; });
    return S.test.blocks.map(function (b, i) { return { b: b, i: i, qs: b.questions.filter(function (q) { return set[q.n]; }) }; })
      .filter(function (x) { return x.qs.length; });
  }
  function answeredCount() { return S.qids.filter(function (n) { return !!S.answers[n]; }).length; }

  function renderEnglish() {
    var tests = TESTS.filter(function (t) { return t.subject === 'anh'; });
    var cards = tests.map(function (t) {
      var n = total(t);
      var hist = histAll().filter(function (h) { return h.testId === t.id; });
      var parts = t.blocks.map(function (b) {
        var ns = b.questions.map(function (q) { return q.n; });
        return '<li class="part-item"><div><div class="t">' + esc(b.short) + '</div><div class="r">Câu ' + ns[0] + (ns.length > 1 ? '–' + ns[ns.length - 1] : '') + ' · ' + ns.length + ' câu</div></div>' +
          '<button class="btn small ghost" data-act="part" data-test="' + t.id + '" data-block="' + b.id + '">Luyện phần này</button></li>';
      }).join('');

      return '<article class="panel test-card">' +
        '<div><h3>' + esc(t.title) + '</h3><p class="sub">Lexico-Grammar và Reading · theo cấu trúc đề THPT</p></div>' +
        '<div class="kpis"><span><b>' + n + '</b> câu</span><span><b>' + t.blocks.length + '</b> phần</span><span>Đã làm: <b>' + hist.length + '</b> lần</span></div>' +
        '<div class="modes">' +
          '<div class="mode"><h4>Luyện tập</h4><p>Chọn đáp án xong là thấy ngay đáp án đúng và lời giải.</p><button class="btn" data-act="start" data-mode="practice" data-test="' + t.id + '">Bắt đầu luyện tập</button></div>' +
          '<div class="mode"><h4>Thi thử</h4><p>Làm cả đề có bấm giờ, chấm điểm và xem lời giải sau khi nộp bài.</p><button class="btn" data-act="start" data-mode="exam" data-test="' + t.id + '">Bắt đầu thi thử</button></div>' +
        '</div>' +
        '<div><h2 class="sec">Luyện theo từng phần</h2><ul class="part-list">' + parts + '</ul></div>' +
      '</article>';
    }).join('');

    app.innerHTML =
      '<section class="page-head"><div class="page-head-in">' +
        '<a class="crumb" href="index.html">← Quay lại bàn cờ</a>' +
        '<h1>Tiếng Anh</h1>' +
        '<p>Làm đề, xem đáp án và lời giải từng câu.</p>' +
      '</div></section>' +
      '<div class="page-body"><div class="test-card">' + cards + '</div></div>';
  }

  function passageHTML(b) {
    if (!b.paras) return '';
    var h = '<article class="passage" tabindex="0">';
    if (b.passageTitle) h += '<h3>' + esc(b.passageTitle) + '</h3>';
    b.paras.forEach(function (p, i) {
      if (p.indexOf('## ') === 0) h += '<h4>' + esc(p.slice(3)) + '</h4>';
      else h += '<p>' + (b.numbered ? '<span class="pn">' + (i + 1) + '</span>' : '') + fmt(p) + '</p>';
    });
    if (b.source) h += '<p class="src">' + esc(b.source) + '</p>';
    return h + '</article>';
  }

  function qHTML(q) {
    var a = S.answers[q.n], rv = reveal(q.n), L = ['A', 'B', 'C', 'D'];
    var opts = q.opts.map(function (t, i) {
      var l = L[i], cls = 'opt', mark = '', sr = '';
      if (a === l) cls += ' chosen';
      if (rv) {
        if (l === q.ans) { cls += ' correct'; mark = '<span class="mark">✓</span>'; sr = ' (đúng)'; }
        else if (l === a) { cls += ' wrong'; mark = '<span class="mark">✕</span>'; sr = ' (sai)'; }
      }
      return '<label class="' + cls + '"><input type="radio" name="q' + q.n + '" value="' + l + '"' + (a === l ? ' checked' : '') + (rv ? ' disabled' : '') + '>' +
        '<span class="letter">' + l + '</span><span class="otext">' + fmt(t) + sr + '</span>' + mark + '</label>';
    }).join('');

    var stem = q.stem ? '<p class="q-stem">' + fmt(q.stem) + '</p>' : '<p class="q-stem">Chọn đáp án đúng cho chỗ trống (' + q.n + ').</p>';
    var tools = (S.mode === 'exam' && !S.submitted) ? '<div class="q-tools"><button type="button" class="flag ' + (S.flags[q.n] ? 'on' : '') + '" data-act="flag" data-n="' + q.n + '">⚑ ' + (S.flags[q.n] ? 'Bỏ đánh dấu' : 'Đánh dấu') + '</button></div>' : '';
    var exp = rv ? '<div class="exp"><p class="head">' + (a === q.ans ? 'Chính xác.' : 'Chưa đúng.') + ' Đáp án: ' + q.ans + '</p><p>' + esc(q.exp) + '</p></div>' : '';
    return '<fieldset class="q" id="q-' + q.n + '"><legend>Câu ' + q.n + '</legend>' + stem + '<div class="opts">' + opts + '</div>' + tools + exp + '</fieldset>';
  }

  function paletteHTML(vb) {
    var cur = vb[S.blockIdx] ? vb[S.blockIdx].b.id : '';
    var groups = vb.map(function (x) {
      var btns = x.qs.map(function (q) {
        var st = '';
        var a = S.answers[q.n], ans = S.qmap[q.n].q.ans;
        if (S.submitted) st = a ? (a === ans ? 'ok' : 'bad') : 'skip';
        else if (reveal(q.n)) st = (a === ans) ? 'ok' : 'bad';
        else if (a) st = 'done';
        if (S.flags[q.n]) st += ' flagged';
        return '<button type="button" class="pal ' + st + (x.b.id === cur ? ' current' : '') + '" data-act="goto" data-n="' + q.n + '">' + q.n + '</button>';
      }).join('');
      return '<div><h4>' + esc(x.b.short) + '</h4><div class="pal-grid">' + btns + '</div></div>';
    }).join('');
    return '<div class="palette-in">' + groups + '</div>';
  }

  function renderRunner() {
    var vb = visibleBlocks();
    var barTitle = '<div class="rb-title">' + esc(S.test.title) + '<span>' + (S.review ? 'Xem lại' : modeName(S.mode)) + '</span></div>';
    if (!vb.length) {
      app.innerHTML = '<div class="runbar"><div class="runbar-in">' + barTitle + '<button class="btn small" data-act="results">Kết quả</button></div></div><div class="run-main"><div class="empty"><p>Không có câu sai.</p><button class="btn small" data-act="show-all">Hiện tất cả</button></div></div>';
      return;
    }
    if (S.blockIdx >= vb.length) S.blockIdx = vb.length - 1;
    var cur = vb[S.blockIdx], b = cur.b;
    var hasP = !!b.paras;

    var right = S.review
      ? '<button class="btn small ghost" data-act="palette">Danh sách câu</button><button class="btn small" data-act="results">Kết quả</button>'
      : '<div class="rb-stat"><span>⏱ <span id="rb-time">' + mmss(S.secs) + '</span></span><span>' + answeredCount() + '/' + S.qids.length + ' câu</span></div>' +
        '<button class="btn small ghost" data-act="palette">Danh sách câu</button>' +
        '<button class="btn small" data-act="finish">' + (S.mode === 'exam' ? 'Nộp bài' : 'Xem kết quả') + '</button>';

    app.innerHTML =
      '<div class="runbar"><div class="runbar-in">' + barTitle + right + '</div>' +
      '<div class="palette" id="palette"' + (S.paletteOpen ? '' : ' hidden') + '>' + paletteHTML(vb) + '</div></div>' +
      '<div class="run-main">' +
        '<p class="part-kicker">' + esc(b.part) + ' · Phần ' + (S.blockIdx + 1) + '/' + vb.length + '</p>' +
        '<h2 class="block-title">' + esc(b.title) + '</h2>' +
        '<p class="instruction">' + esc(b.instruction) + '</p>' +
        '<div class="block-body' + (hasP ? ' has-passage' : '') + '">' + passageHTML(b) + '<div class="questions">' + cur.qs.map(qHTML).join('') + '</div></div>' +
        '<div class="block-nav">' +
          (S.blockIdx > 0 ? '<button class="btn ghost" data-act="prev">← Trước</button>' : '<span></span>') +
          (S.blockIdx < vb.length - 1 ? '<button class="btn" data-act="next">Sau →</button>' : '<button class="btn" data-act="finish">Hoàn thành</button>') +
        '</div>' +
      '</div>';
    if (!S.submitted) startTimer();
  }

  function renderResult() {
    var r = S.result, pct = r.total ? r.correct / r.total : 0, ten = (pct * 10).toFixed(1).replace('.', ',');
    var bars = r.per.map(function (p) {
      var w = p.total ? Math.round(p.correct / p.total * 100) : 0;
      return '<div class="bar-row"><div class="bar-label"><span>' + esc(p.title) + '</span><span>' + p.correct + '/' + p.total + '</span></div><div class="bar"><i style="width:' + w + '%"></i></div></div>';
    }).join('');

    app.innerHTML =
      '<section class="page-head"><div class="page-head-in"><a class="crumb" href="anh.html">← Tiếng Anh</a><h1>Kết quả</h1></div></section>' +
      '<div class="page-body"><div class="panel score-card">' +
        '<p class="big">' + r.correct + '<small>/' + r.total + '</small></p>' +
        '<div class="score-meta"><span>Điểm: <b>' + ten + '/10</b></span><span>Đúng: <b>' + r.correct + '</b></span><span>Sai: <b>' + (r.total - r.correct) + '</b></span><span>Thời gian: <b>' + mmss(r.secs) + '</b></span></div>' +
        '<div class="bars">' + bars + '</div>' +
        '<div class="btn-row"><button class="btn" data-act="review">Xem lại bài</button><button class="btn ghost" data-act="again">Làm lại</button></div>' +
      '</div></div>';
  }

  function route() {
    stopTimer();
    var hash = location.hash.replace(/^#\/?/, '');
    if (hash === 'lam-bai') {
      if (!S.test || !S.qids.length) { startAttempt(TESTS[0], 'practice', allQids(TESTS[0]), ''); return; }
      renderRunner();
    } else if (hash === 'ket-qua') {
      if (!S.result) { renderEnglish(); return; }
      renderResult();
    } else {
      renderEnglish();
    }
    window.scrollTo(0, 0);
  }

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t.matches('.q input[type=radio]')) {
      var n = parseInt(t.name.slice(1), 10);
      if (S.submitted || (S.mode === 'practice' && S.answers[n])) return;
      S.answers[n] = t.value; saveProgress();
      var el = document.getElementById('q-' + n);
      if (el) {
        var tmp = document.createElement('div'); tmp.innerHTML = qHTML(S.qmap[n].q);
        el.replaceWith(tmp.firstElementChild);
      }
    }
  });

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el) return;
    var act = el.getAttribute('data-act');
    var test = el.getAttribute('data-test') ? getTest(el.getAttribute('data-test')) : null;
    switch (act) {
      case 'start': startAttempt(test, el.getAttribute('data-mode'), allQids(test), ''); break;
      case 'part': {
        var bid = el.getAttribute('data-block');
        var blk = test.blocks.filter(function (b) { return b.id === bid; })[0];
        startAttempt(test, 'practice', blk.questions.map(function (q) { return q.n; }), blk.short);
        break;
      }
      case 'prev': S.blockIdx--; renderRunner(); window.scrollTo(0, 0); break;
      case 'next': S.blockIdx++; renderRunner(); window.scrollTo(0, 0); break;
      case 'finish': {
        S.secs = Math.floor((Date.now() - S.startMs) / 1000);
        var wrong = S.qids.filter(function (n) { return S.answers[n] !== S.qmap[n].q.ans; });
        var per = S.test.blocks.map(function (b) {
          var ids = b.questions.map(function (q) { return q.n; }).filter(function (n) { return S.qids.indexOf(n) >= 0; });
          if (!ids.length) return null;
          return { title: b.short, total: ids.length, correct: ids.filter(function (n) { return S.answers[n] === S.qmap[n].q.ans; }).length };
        }).filter(Boolean);
        S.result = { correct: S.qids.length - wrong.length, total: S.qids.length, wrong: wrong, per: per };
        S.submitted = true; stopTimer();
        var h = []; try { h = JSON.parse(localStorage.getItem('ontap:history') || '[]'); } catch(e){}
        h.unshift({ ts: Date.now(), testId: S.test.id, title: S.test.title, mode: S.mode, correct: S.result.correct, total: S.result.total, secs: S.secs });
        localStorage.setItem('ontap:history', JSON.stringify(h.slice(0, 30)));
        go('#ket-qua');
        break;
      }
      case 'results': go('#ket-qua'); break;
      case 'review': S.review = true; S.onlyWrong = false; S.blockIdx = 0; go('#lam-bai'); break;
      case 'again': startAttempt(S.test, S.mode, allQids(S.test), ''); break;
      case 'palette': {
        S.paletteOpen = !S.paletteOpen;
        var p = $('#palette'); if (p) p.hidden = !S.paletteOpen;
        break;
      }
      case 'goto': {
        var n = parseInt(el.getAttribute('data-n'), 10);
        S.paletteOpen = false;
        var vb = visibleBlocks();
        for (var i = 0; i < vb.length; i++) {
          if (vb[i].qs.some(function (q) { return q.n === n; })) {
            S.blockIdx = i; renderRunner();
            requestAnimationFrame(function () {
              var qel = document.getElementById('q-' + n);
              if (qel) qel.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            break;
          }
        }
        break;
      }
      case 'flag': {
        var n = parseInt(el.getAttribute('data-n'), 10);
        if (S.flags[n]) delete S.flags[n]; else S.flags[n] = 1;
        var qel = document.getElementById('q-' + n);
        if (qel) {
          var tmp = document.createElement('div'); tmp.innerHTML = qHTML(S.qmap[n].q);
          qel.replaceWith(tmp.firstElementChild);
        }
        break;
      }
    }
  });

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
